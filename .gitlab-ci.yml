image: python:3.12

stages:
  - lint     # Check code style (Fast)
  - test     # Run unit tests (Medium)
  - build
  - deploy   # Send to Azure/Cloud (Final)

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "${CI_PROJECT_DIR}:${CI_PROJECT_DIR}/src"
  AZURE_WEBAPP_NAME: "Email-agent"
  AZURE_RESOURCE_GROUP: "email-agent_group"

cache:
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt
  - echo "PYTHONPATH=$PYTHONPATH"
  - python -c "import sys; print('Python path:', sys.path)"

  # File variables are automatically written to temp files
  # Copy them to the expected locations
  - |
    if [ -f "$GMAIL_CREDENTIALS_JSON" ]; then
      cp $GMAIL_CREDENTIALS_JSON credentials.json
      echo "✅ credentials.json configured"
    else
      echo "credentials.json not found"
    fi
  
  - |
    if [ -f "$GMAIL_TOKEN_JSON" ]; then
      cp $GMAIL_TOKEN_JSON token.json
      echo "✅ token.json configured"
    else
      echo "token.json not found"
    fi

lint_code:
  stage: lint
  script:
    - pip install flake8
    - flake8 app.py src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
  allow_failure: true  # Don't fail pipeline on lint warnings

run_unit_tests:
  stage: test
  script:
    - pytest tests/ -m unit -v --tb=short
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'  

build:package:
  stage: build
  script:
    - echo "Building deployment package..."
    - mkdir -p deploy_package
    - apt-get update && apt-get install -y zip
    - cp -r src/ deploy_package/
    - cp app.py deploy_package/
    - cp requirements.txt deploy_package/
    - |
      if [ -f "credentials.json" ]; then
        cp credentials.json deploy_package/
        echo "✅ Copied credentials.json"
      else
        echo "No credentials.json found"
      fi
    - |
      if [ -f "token.json" ]; then
        cp token.json deploy_package/
        echo "✅ Copied token.json"
      else
        echo "No token.json found"
      fi
    - cd deploy_package
    - zip -r ../deploy.zip .
    - cd ..
    - ls -lh deploy.zip
    - echo "✅ Package created"
  artifacts:
    paths:
      - deploy.zip
    expire_in: 1 day
  only:
    - main

deploy:azure:
  stage: deploy
  image: python:3.12
  before_script:
    - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
    - az --version
  script:
    - echo "🚀 Deploying to Azure..."
    - |
      az login --service-principal \
        -u $AZURE_CLIENT_ID \
        -p $AZURE_CLIENT_SECRET \
        --tenant $AZURE_TENANT_ID
    
    - az account show
    
    - |
      az webapp deployment source config-zip \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_WEBAPP_NAME \
        --src deploy.zip \
        --timeout 600
    
    - |
      az webapp config set \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_WEBAPP_NAME \
        --startup-file "startup.sh"

    - |
      az webapp config appsettings set \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_WEBAPP_NAME \
        --settings \
          GROQ_API_KEY="$GROQ_API_KEY" \
          PYTHONUNBUFFERED=1 \
          ENVIRONMENT=production \
          SCM_DO_BUILD_DURING_DEPLOYMENT=true \
          WEBSITES_ENABLE_APP_SERVICE_STORAGE=false
    
    - |
      az webapp restart \
        --resource-group $AZURE_RESOURCE_GROUP \
        --name $AZURE_WEBAPP_NAME
    
    - echo "✅ Deployed to https://${AZURE_WEBAPP_NAME}.azurewebsites.net"
  
  environment:
    name: production
    url: https://$AZURE_WEBAPP_NAME.azurewebsites.net
  
  dependencies:
    - build:package
  
  only:
    - main
  
  when: manual