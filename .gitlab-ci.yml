image: python:3.12

stages:
  - lint     # Check code style (Fast)
  - test     # Run unit tests (Medium)
  - deploy   # Send to Azure/Cloud (Final)

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "${CI_PROJECT_DIR}:${CI_PROJECT_DIR}/src"

cache:
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt
  - echo "PYTHONPATH=$PYTHONPATH"
  - python -c "import sys; print('Python path:', sys.path)"

  # File variables are automatically written to temp files
  # Copy them to the expected locations
  - |
    if [ -f "$GMAIL_CREDENTIALS_JSON" ]; then
      cp $GMAIL_CREDENTIALS_JSON credentials.json
      echo "✅ credentials.json configured"
    else
      echo "credentials.json not found"
    fi
  
  - |
    if [ -f "$GMAIL_TOKEN_JSON" ]; then
      cp $GMAIL_TOKEN_JSON token.json
      echo "✅ token.json configured"
    else
      echo "token.json not found"
    fi

lint_code:
  stage: lint
  script:
    - pip install flake8
    - flake8 app.py src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
  allow_failure: true  # Don't fail pipeline on lint warnings

run_unit_tests:
  stage: test
  script:
    - pytest tests/ -m unit -v --tb=short
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'  

deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  script:
    # Login using the individual variables
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    
    # Deploy the code
    - az webapp up --name Email-agent --resource-group email-agent_group --runtime "PYTHON:3.12"
  only:
    - main